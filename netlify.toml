[build]
  publish = "public"
  # Kein Build-Schritt — reine statische Seite.
  command = "echo 'no build step'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Verhindert dass Netlify die JSON ewig cached — damit der Auto-Refresh im
# Browser auch wirklich neue Daten sieht.
[[headers]]
  for = "/data/positions.json"
  [headers.values]
    Cache-Control = "public, max-age=60, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"
