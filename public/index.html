<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="color-scheme" content="dark light" />
<title>Container Tracker</title>

<!-- iOS Web-App -->
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Container Tracker" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0e1116" />

<!-- Favicons -->
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
<link rel="shortcut icon" href="/favicon.ico" />

<!-- PWA Manifest (für Android Chrome) -->
<link rel="manifest" href="/manifest.webmanifest" />

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin="" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <div class="title">
    <span class="icon">🚢</span>
    <h1 id="title">Container Tracker</h1>
  </div>
  <div class="meta">
    <span id="updated">– keine Daten –</span>
    <span class="dot" id="status-dot" title="Live"></span>
    <button id="reload" type="button" title="Daten aus dem Cache neu laden">↻</button>
    <button id="refresh" type="button" title="VesselFinder jetzt frisch abfragen (dauert ~1 min)">⚡ Frisch holen</button>
  </div>
</header>

<main>
  <section id="cards"></section>

  <section id="map-wrap">
    <div id="map"></div>
  </section>

  <section id="chart-wrap">
    <div class="chart-header">
      <h2>Kumulierte Strecke</h2>
      <label class="toggle">
        <input type="checkbox" id="show-speed" />
        <span>km/h-Werte an jedem Punkt einblenden</span>
      </label>
    </div>
    <div id="chart-holder"><canvas id="km-chart"></canvas></div>
  </section>

  <p id="error" hidden></p>
</main>

<footer>
  Daten: <a href="https://www.vesselfinder.com" target="_blank" rel="noopener">vesselfinder.com</a> ·
  Tiles: <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> ·
  Auto-Update stündlich via GitHub Actions
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
